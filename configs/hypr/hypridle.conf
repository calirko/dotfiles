general {
    lock_cmd = pidof hyprlock >/dev/null || hyprlock
    before_sleep_cmd = pidof hyprlock >/dev/null || hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 3 min: dim to 5%, on battery only. on-resume fires whether or not the dim
# ran, so the marker file limits the restore to a dim that actually happened;
# a bare `brightnessctl -r` on AC would restore some stale earlier save.
listener {
    timeout = 180
    on-timeout = [ "$(cat /sys/class/power_supply/AC*/online)" = "0" ] && brightnessctl -s set 5% && touch /tmp/hypridle-dimmed
    on-resume = [ -f /tmp/hypridle-dimmed ] && rm /tmp/hypridle-dimmed && brightnessctl -r
}

listener {
    timeout = 600       # 10 min: suspend only on battery
    on-timeout = [ "$(cat /sys/class/power_supply/AC*/online)" = "0" ] && systemctl suspend
}
