# Glass, grayscale (same tokens as eww.scss): no card, just the blurred and
# dimmed desktop with white-alpha text and fills on top.

general {
    disable_loading_bar = true
    hide_cursor = false
}

# Fingerprint auth via fprintd (raccoon's built-in sensor)
auth {
    fingerprint {
        enabled = true
        ready_message = Touch the sensor to unlock
        present_message = Scanning...
        retry_delay = 250
    }
}

# Heavier blur than the panels and dimmed, so text on top reads at any
# wallpaper brightness.
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.1
}

# Time
label {
    monitor =
    # weight via markup: "Geist SemiBold" isn't a family fontconfig knows, so it
    # fell back to Noto Sans
    text = cmd[update:1000] echo "<span weight='600'>$(date +%H:%M)</span>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = Geist
    position = 0, -120
    halign = center
    valign = top
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.68)
    font_size = 18
    font_family = Geist
    position = 0, -270
    halign = center
    valign = top
}

# Avatar (~/.face, same picture as the bar's menu button). Rounded square,
# not a circle.
image {
    monitor =
    path = /home/calirko/.face
    size = 88
    rounding = 19
    border_size = 0
    position = 0, 110
    halign = center
    valign = center
}

# Name
label {
    monitor =
    text = <span weight='600'>$USER</span>
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = Geist
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    position = 0, -20
    halign = center
    valign = center

    rounding = 13
    outline_thickness = 1
    inner_color = rgba(255, 255, 255, 0.10)
    outer_color = rgba(255, 255, 255, 0.08)
    check_color = rgba(255, 255, 255, 0.46)
    fail_color = rgba(255, 255, 255, 0.95)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = Geist
    placeholder_text = <span foreground="##ffffff75">Password</span>
    fail_text = $PAMFAIL$FPRINTFAIL
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_rounding = 3
}

# Fingerprint status
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(255, 255, 255, 0.68)
    font_size = 13
    font_family = Geist
    position = 0, -80
    halign = center
    valign = center
}

# Buttons use the bar's Phosphor icons (Geist has no ☾ ↻ ⏻ glyphs). hyprlock
# loads images by path only, which gives hyprgraphics no size to rasterize an
# SVG at, so these are PNGs pre-rendered at 2x from eww/icons (white):
#   rsvg-convert -w 40 -h 40 ../eww/icons/<name>.svg -o icons/<name>.png

# Suspend button
shape {
    monitor =
    size = 52, 52
    rounding = 13
    color = rgba(255, 255, 255, 0.10)
    border_size = 0
    position = -68, 56
    halign = center
    valign = bottom
    onclick = systemctl suspend
}

image {
    monitor =
    path = /home/calirko/.config/hypr/icons/moon.png
    size = 20
    zindex = 1
    rounding = 0
    border_size = 0
    position = -68, 72
    halign = center
    valign = bottom
    onclick = systemctl suspend
}

# Restart button
shape {
    monitor =
    size = 52, 52
    rounding = 13
    color = rgba(255, 255, 255, 0.10)
    border_size = 0
    position = 0, 56
    halign = center
    valign = bottom
    onclick = systemctl reboot
}

image {
    monitor =
    path = /home/calirko/.config/hypr/icons/arrow-counter-clockwise.png
    size = 20
    zindex = 1
    rounding = 0
    border_size = 0
    position = 0, 72
    halign = center
    valign = bottom
    onclick = systemctl reboot
}

# Power off button
shape {
    monitor =
    size = 52, 52
    rounding = 13
    color = rgba(255, 255, 255, 0.10)
    border_size = 0
    position = 68, 56
    halign = center
    valign = bottom
    onclick = systemctl poweroff
}

image {
    monitor =
    path = /home/calirko/.config/hypr/icons/power.png
    size = 20
    zindex = 1
    rounding = 0
    border_size = 0
    position = 68, 72
    halign = center
    valign = bottom
    onclick = systemctl poweroff
}

animations {
    # hyprlock has its own curve table; same "snappy" as hyprland.lua
    bezier = snappy, 0.18, 1, 0.18, 1
    animation = fadeIn, 2, 2, snappy
    animation = fadeOut, 2, 2, snappy
}
