general {
    disable_loading_bar = true
    hide_cursor = false
}

# Fingerprint auth via fprintd (raccoon's built-in sensor)
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250
    }
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

# Card
shape {
    monitor =
    size = 420, 600
    rounding = 10
    color = rgb(13, 13, 13)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, 0
    halign = center
    valign = center
}

# Time
label {
    monitor =
    # weight via markup: "Geist SemiBold" isn't a family fontconfig knows, so it
    # fell back to Noto Sans
    text = cmd[update:1000] echo "<span weight='600'>$(date +%H:%M)</span>"
    color = rgba(235, 235, 235, 1.0)
    font_size = 64
    font_family = Geist
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(138, 138, 138, 1.0)
    font_size = 16
    font_family = Geist
    position = 0, 175
    halign = center
    valign = center
}

# Fingerprint status
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(107, 107, 107, 1.0)
    font_size = 13
    font_family = Geist
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    position = 0, 10
    halign = center
    valign = center

    rounding = 6
    dots_rounding = -1
    outline_thickness = 1
    inner_color = rgb(13, 13, 13)
    outer_color = rgba(255, 255, 255, 0.10)
    check_color = rgba(138, 138, 138, 1.0)
    fail_color = rgba(245, 245, 245, 1.0)
    font_color = rgba(214, 214, 214, 1.0)
    placeholder_text = <span foreground="##6b6b6b">password</span>
    fail_text = $PAMFAIL$FPRINTFAIL
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
}

# Buttons use the bar's Phosphor icons (Geist has no ☾ ↻ ⏻ glyphs, so those
# fell back to FreeMono). hyprlock loads images by path only, which gives
# hyprgraphics no size to rasterize an SVG at, so these are PNGs pre-rendered
# at 2x from eww/icons:
#   rsvg-convert -w 40 -h 40 ../eww/icons/<name>.svg -o icons/<name>.png

# Suspend button
shape {
    monitor =
    size = 56, 56
    rounding = 6
    color = rgb(26, 26, 26)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = -110, -220
    halign = center
    valign = center
    onclick = systemctl suspend
}

image {
    monitor =
    path = /home/calirko/.config/hypr/icons/moon.png
    size = 20
    zindex = 1
    rounding = 0
    border_size = 0
    position = -110, -220
    halign = center
    valign = center
    onclick = systemctl suspend
}

# Restart button
shape {
    monitor =
    size = 56, 56
    rounding = 6
    color = rgb(26, 26, 26)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, -220
    halign = center
    valign = center
    onclick = systemctl reboot
}

image {
    monitor =
    path = /home/calirko/.config/hypr/icons/arrow-counter-clockwise.png
    size = 20
    zindex = 1
    rounding = 0
    border_size = 0
    position = 0, -220
    halign = center
    valign = center
    onclick = systemctl reboot
}

# Power off button
shape {
    monitor =
    size = 56, 56
    rounding = 6
    color = rgb(26, 26, 26)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 110, -220
    halign = center
    valign = center
    onclick = systemctl poweroff
}

image {
    monitor =
    path = /home/calirko/.config/hypr/icons/power.png
    size = 20
    zindex = 1
    rounding = 0
    border_size = 0
    position = 110, -220
    halign = center
    valign = center
    onclick = systemctl poweroff
}

animations {
    # hyprlock has its own curve table; same "snappy" as hyprland.lua
    bezier = snappy, 0.18, 1, 0.18, 1
    animation = fadeIn, 2, 2, snappy
    animation = fadeOut, 2, 2, snappy
}
