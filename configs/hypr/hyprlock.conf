general {
    disable_loading_bar = true
    hide_cursor = false
}

# Fingerprint auth via fprintd (raccoon's built-in sensor)
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250
    }
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

# Card
shape {
    monitor =
    size = 420, 600
    rounding = 10
    color = rgb(13, 13, 13)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, 0
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(235, 235, 235, 1.0)
    font_size = 64
    font_family = Geist SemiBold
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(138, 138, 138, 1.0)
    font_size = 16
    font_family = Geist
    position = 0, 175
    halign = center
    valign = center
}

# Fingerprint status
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(107, 107, 107, 1.0)
    font_size = 13
    font_family = Geist
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    position = 0, 10
    halign = center
    valign = center

    rounding = 14
    dots_rounding = -1
    outline_thickness = 1
    inner_color = rgb(13, 13, 13)
    outer_color = rgba(255, 255, 255, 0.10)
    check_color = rgba(138, 138, 138, 1.0)
    fail_color = rgba(245, 245, 245, 1.0)
    font_color = rgba(214, 214, 214, 1.0)
    placeholder_text = <span foreground="##6b6b6b">password</span>
    fail_text = $PAMFAIL$FPRINTFAIL
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
}

# Suspend button
shape {
    monitor =
    size = 56, 56
    rounding = 10
    color = rgb(26, 26, 26)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = -110, -220
    halign = center
    valign = center
    onclick = systemctl suspend
}

label {
    monitor =
    text = ☾
    color = rgba(214, 214, 214, 1.0)
    font_size = 22
    font_family = Geist
    position = -110, -220
    halign = center
    valign = center
    onclick = systemctl suspend
}

# Restart button
shape {
    monitor =
    size = 56, 56
    rounding = 10
    color = rgb(26, 26, 26)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 0, -220
    halign = center
    valign = center
    onclick = systemctl reboot
}

label {
    monitor =
    text = ↻
    color = rgba(214, 214, 214, 1.0)
    font_size = 22
    font_family = Geist
    position = 0, -220
    halign = center
    valign = center
    onclick = systemctl reboot
}

# Power off button
shape {
    monitor =
    size = 56, 56
    rounding = 10
    color = rgb(26, 26, 26)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.10)
    position = 110, -220
    halign = center
    valign = center
    onclick = systemctl poweroff
}

label {
    monitor =
    text = ⏻
    color = rgba(214, 214, 214, 1.0)
    font_size = 22
    font_family = Geist
    position = 110, -220
    halign = center
    valign = center
    onclick = systemctl poweroff
}

animations {
    animation = fadeIn, 2, 2, snappy
    animation = fadeOut, 2, 2, snappy
}
